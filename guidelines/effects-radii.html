<!-- @dsCard group="Effects" viewport="700x170" name="Corner radii" subtitle="Everything is rounded; pucks are ellipses" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--blue-300);border-radius:var(--radius-xs);height:72px"></div><div class="tok">--radius-xs</div><div class="val">6px · tags</div></div><div class="sw"><div class="chip" style="background:var(--blue-300);border-radius:var(--radius-sm);height:72px"></div><div class="tok">--radius-sm</div><div class="val">10px · sliders, badges</div></div><div class="sw"><div class="chip" style="background:var(--blue-300);border-radius:var(--radius-md);height:72px"></div><div class="tok">--radius-md</div><div class="val">16px · buttons, cells, cards</div></div><div class="sw"><div class="chip" style="background:var(--blue-300);border-radius:var(--radius-lg);height:72px"></div><div class="tok">--radius-lg</div><div class="val">22px · rows, tabs</div></div><div class="sw"><div class="chip" style="background:var(--blue-300);border-radius:var(--radius-xl);height:72px"></div><div class="tok">--radius-xl</div><div class="val">28px · panels</div></div><div class="sw"><div class="chip" style="background:var(--blue-300);border-radius:var(--radius-pill);height:72px"></div><div class="tok">--radius-pill</div><div class="val">999px · pills, tracks</div></div></div></body></html>
