<!-- @dsCard group="Colors" viewport="700x150" name="Wood · Stone" subtitle="Frames, fences and signposts · locked and disabled" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--wood-100);"></div><div class="tok">--wood-100</div></div><div class="sw"><div class="chip" style="background:var(--wood-300);"></div><div class="tok">--wood-300</div></div><div class="sw"><div class="chip" style="background:var(--wood-500);"></div><div class="tok">--wood-500</div></div><div class="sw"><div class="chip" style="background:var(--wood-700);"></div><div class="tok">--wood-700</div></div><div class="sw"><div class="chip" style="background:var(--wood-900);"></div><div class="tok">--wood-900</div></div><div style="width:10px"></div><div class="sw"><div class="chip" style="background:var(--stone-100);"></div><div class="tok">--stone-100</div></div><div class="sw"><div class="chip" style="background:var(--stone-300);"></div><div class="tok">--stone-300</div></div><div class="sw"><div class="chip" style="background:var(--stone-500);"></div><div class="tok">--stone-500</div></div><div class="sw"><div class="chip" style="background:var(--stone-700);"></div><div class="tok">--stone-700</div></div><div class="sw"><div class="chip" style="background:var(--stone-900);"></div><div class="tok">--stone-900</div></div></div>
<div class="cap">Wood-100 is the plank body of wood panels. Stone replaces every tone when something is locked.</div></body></html>
