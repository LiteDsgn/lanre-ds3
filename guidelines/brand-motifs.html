<!-- @dsCard group="Brand" viewport="700x200" name="Signature motifs" subtitle="The five things that make a screen read as Lanre" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--bg-meadow);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div style="display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap">
<div style="display:grid;gap:6px;justify-items:center"><div style="position:relative;width:84px;height:52px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,var(--blue-300),var(--blue-500) 80%);border:3px solid var(--blue-300);box-shadow:0 11px 0 var(--blue-700),0 17px 12px oklch(.2 .05 60 / .35),inset 0 3px 0 oklch(1 0 0 / .55);display:grid;place-items:center;margin-bottom:11px"><span class="mp-display mp-outline mp-outline-blue" style="font-size:38px">3</span></div><div class="tok" style="color:#fff">3D puck</div></div>
<div style="display:grid;gap:6px;justify-items:center"><div style="width:120px;height:22px;border-radius:999px;background:oklch(.3 .06 55 / .85);border:2px solid oklch(.2 .05 55 / .9);overflow:hidden;box-shadow:inset 0 2px 4px oklch(0 0 0 / .35)"><div style="width:60%;height:100%;border-radius:999px;background:linear-gradient(180deg,var(--gold-300),var(--gold-500) 55%,var(--gold-700));position:relative"><div style="position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(-55deg,transparent 0 8px,oklch(1 0 0 / .55) 8px 14px)"></div></div></div><div class="tok" style="color:#fff">striped fill</div></div>
<div style="display:grid;gap:6px;justify-items:center"><span class="mp-display mp-outline" style="font-size:30px;text-transform:uppercase">Boost</span><div class="tok" style="color:#fff">outlined type</div></div>
<div style="display:grid;gap:6px;justify-items:center"><div style="width:110px;height:44px;border-radius:16px;background:linear-gradient(180deg,var(--wood-300),var(--wood-500));border:4px solid var(--wood-700);box-shadow:0 4px 0 var(--wood-900),inset 0 2px 0 oklch(1 0 0 / .3)"></div><div class="tok" style="color:#fff">wood sign</div></div>
<div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;border-radius:16px;background:var(--surface-cell);border:3px solid oklch(1 0 0 / .08);box-shadow:inset 0 2px 6px oklch(0 0 0 / .25)"></div><div class="tok" style="color:#fff">translucent cell</div></div>
<div style="display:grid;gap:6px;justify-items:center"><div style="width:110px;height:64px;border-radius:22px 22px 0 0;background:#fff;border:4px solid var(--cream-300);border-bottom:0;display:grid;place-items:center" class="mp-display"><span style="font-size:16px;letter-spacing:.06em;color:var(--ink-700)">SHOP</span></div><div class="tok" style="color:#fff">tab header</div></div>
</div></body></html>
