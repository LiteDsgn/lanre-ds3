<!-- @dsCard group="Colors" viewport="700x150" name="Meadow green" subtitle="Environment ramp: grass, bushes, board tiles" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--green-100);"></div><div class="tok">--green-100</div><div class="val">oklch(0.94 0.08 128)</div></div><div class="sw"><div class="chip" style="background:var(--green-300);"></div><div class="tok">--green-300</div><div class="val">oklch(0.85 0.17 132)</div></div><div class="sw"><div class="chip" style="background:var(--green-500);"></div><div class="tok">--green-500</div><div class="val">oklch(0.74 0.19 136)</div></div><div class="sw"><div class="chip" style="background:var(--green-700);"></div><div class="tok">--green-700</div><div class="val">oklch(0.58 0.16 140)</div></div><div class="sw"><div class="chip" style="background:var(--green-900);"></div><div class="tok">--green-900</div><div class="val">oklch(0.40 0.10 142)</div></div></div>
<div class="cap">300→500 is the default grass gradient (--bg-meadow); 700 is the tile side; 900 strokes text on green.</div></body></html>
