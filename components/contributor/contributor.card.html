<!-- @dsCard group="Adventure" viewport="780x760" name="Contributor kit" subtitle="StepBar, TextField, WorldChip, RadioCard, UploadTile (memory blocks), the phone-first composer" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../tools/ds-loader.js" data-root="../.." data-components="contributor/StepBar,contributor/TextField,contributor/WorldChip,contributor/RadioCard,contributor/UploadTile,identity/Avatar"></script>
<style>html,body{margin:0}body{padding:18px;background:var(--world-bg);min-height:100vh;box-sizing:border-box;font-family:var(--font-ui);color:var(--text-primary)}
.mp-boot{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;pointer-events:none}
.mp-boot-track{width:180px;height:22px;border-radius:999px;background:oklch(0.30 0.06 55 / .85);border:2px solid oklch(0.20 0.05 55 / .9);box-shadow:inset 0 2px 4px oklch(0 0 0 / .35);overflow:hidden}
.mp-boot-fill{height:100%;width:60%;border-radius:999px;background:linear-gradient(180deg,var(--gold-300),var(--gold-500) 55%,var(--gold-700));position:relative;animation:mp-boot-grow 1.6s var(--ease-out) infinite alternate}
.mp-boot-fill::after{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(-55deg,transparent 0 8px,oklch(1 0 0 / .55) 8px 14px)}
@keyframes mp-boot-grow{from{width:25%}to{width:85%}}
</style>
</head><body data-world="base_camp"><div id="root"><div class="mp-boot" aria-hidden="true"><div class="mp-boot-track"><div class="mp-boot-fill"></div></div></div></div>
<script type="text/babel">
const Row = ({ children, gap = 14, align = 'center', style }) => <div style={{ display: 'flex', gap, alignItems: align, flexWrap: 'wrap', ...style }}>{children}</div>;
const Col = ({ children, gap = 16, style }) => <div style={{ display: 'grid', gap, ...style }}>{children}</div>;
const Note = ({ children, dark = true }) => <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 12, color: dark ? '#fff' : 'var(--ink-500)', textShadow: dark ? '0 1px 0 oklch(0 0 0 / 0.4)' : 'none', opacity: .9 }}>{children}</span>;

MPReady.then(({ StepBar, TextField, WorldChip, RadioCard, UploadTile, Avatar }) => {
  const photo = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" fill="#8fd3f4"/><circle cx="70" cy="26" r="12" fill="#ffd66b"/><path d="M0 70 Q30 48 56 66 T96 60 V96 H0Z" fill="#7cc46a"/><path d="M0 82 Q40 66 96 80 V96 H0Z" fill="#5aa84f"/></svg>');
  const noop = () => {};
  const keys = { onMoveUp: noop, onMoveDown: noop, onRemove: noop };
  function Demo() {
    const [name, setName] = React.useState('Ada Okafor');
    const [theme, setTheme] = React.useState('small_chops');
    const [reveals, setReveals] = React.useState(false);
    const [caption, setCaption] = React.useState('');
    return (
      <Row gap={24} align="flex-start">
        <div style={{ width: 358, padding: 18, boxSizing: 'border-box', borderRadius: 'var(--radius-xl)', background: 'var(--cream-100)', border: '4px solid var(--cream-300)', boxShadow: 'var(--shadow-drop)', display: 'grid', gap: 16 }}>
          <StepBar steps={['You', 'Memories', 'Preview', 'Submit']} current={1} />
          <TextField label="The name the recipient knows you by" value={name} onChange={setName} helper="Shown to her only after the reveal." />
          <Row gap={10}>{['mango_grove', 'small_chops', 'good_energy', 'japan'].map(w => <WorldChip key={w} world={w} size="sm" selected={theme === w} onClick={() => setTheme(w)} />)}</Row>
          <div role="radiogroup" aria-label="Does this memory show who you are?" style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 'var(--space-3)' }}>
            <RadioCard checked={!reveals} onChange={() => setReveals(false)} media={<Avatar mystery size={72} aria-hidden="true" />} title="Keeps me a mystery" description="No face, name or voice in here." />
            <RadioCard checked={reveals} onChange={() => setReveals(true)} media={<Avatar name={name || '?'} size={72} alt="" aria-hidden="true" />} title="Shows who I am" description="Skip the guessing for this one." />
          </div>
        </div>
        <div style={{ width: 358, display: 'grid', gap: 16 }}>
          <div style={{ justifySelf: 'center' }}><StepBar steps={['Where', 'Who', 'Write', 'Details']} current={2} labels /></div>
          <ol style={{ listStyle: 'none', margin: 0, padding: 0, display: 'grid', gap: 22 }}>
            <li><UploadTile type="photo" index={0} count={3} state="done" name="beach.jpg" details="2.4 MB" thumb={photo} {...keys}><TextField label="Caption" optional value={caption} onChange={setCaption} /></UploadTile></li>
            <li><UploadTile type="video" index={1} count={3} state="uploading" progress={0.42} name="party.mov" details="0:42 · 12.6 MB" onCancel={noop} {...keys} /></li>
            <li><UploadTile type="audio" index={2} count={3} state="error" reason="The file is too big" name="voice.m4a" details="1:15 · 31.2 MB" onRetry={noop} {...keys} /></li>
          </ol>
        </div>
      </Row>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
