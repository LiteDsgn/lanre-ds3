<!-- @dsCard group="Effects" viewport="700x190" name="Bevel & press" subtitle="Solid bottom edge = depth; pressing collapses it" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--bg-meadow);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div style="display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap">
<div style="display:grid;gap:8px;justify-items:center"><div class="mp-display" style="height:36px;padding:0 18px;border-radius:16px;display:grid;place-items:center;font-size:14px;color:var(--gold-900);text-transform:uppercase;background:linear-gradient(180deg,var(--gold-300),var(--gold-500) 42%);box-shadow:0 3px 0 var(--gold-700),0 9px 14px oklch(0.2 0.04 60 / .25),inset 0 2px 0 oklch(1 0 0 / .45)">Claim</div><div class="tok" style="color:#fff">--bevel-sm · 3px</div></div><div style="display:grid;gap:8px;justify-items:center"><div class="mp-display" style="height:48px;padding:0 24px;border-radius:16px;display:grid;place-items:center;font-size:18px;color:var(--gold-900);text-transform:uppercase;background:linear-gradient(180deg,var(--gold-300),var(--gold-500) 42%);box-shadow:0 5px 0 var(--gold-700),0 11px 14px oklch(0.2 0.04 60 / .25),inset 0 2px 0 oklch(1 0 0 / .45)">Claim</div><div class="tok" style="color:#fff">--bevel-md · 5px</div></div><div style="display:grid;gap:8px;justify-items:center"><div class="mp-display" style="height:60px;padding:0 30px;border-radius:16px;display:grid;place-items:center;font-size:24px;color:var(--gold-900);text-transform:uppercase;background:linear-gradient(180deg,var(--gold-300),var(--gold-500) 42%);box-shadow:0 7px 0 var(--gold-700),0 13px 14px oklch(0.2 0.04 60 / .25),inset 0 2px 0 oklch(1 0 0 / .45)">Claim</div><div class="tok" style="color:#fff">--bevel-lg · 7px</div></div>
<div style="width:10px"></div>
<div style="display:grid;gap:8px;justify-items:center"><div class="mp-display" style="height:48px;padding:0 24px;border-radius:16px;display:grid;place-items:center;font-size:18px;color:#fff;text-transform:uppercase;text-shadow:0 2px 0 var(--blue-700);background:linear-gradient(180deg,var(--blue-300),var(--blue-500) 42%);box-shadow:0 5px 0 var(--blue-700),0 11px 14px oklch(0.2 0.04 60 / .25),inset 0 2px 0 oklch(1 0 0 / .45)">Rest</div><div class="tok" style="color:#fff">rest</div></div>
<div style="display:grid;gap:8px;justify-items:center"><div class="mp-display" style="height:48px;padding:0 24px;border-radius:16px;display:grid;place-items:center;font-size:18px;color:#fff;text-transform:uppercase;text-shadow:0 2px 0 var(--blue-700);background:linear-gradient(180deg,var(--blue-300),var(--blue-500) 42%);box-shadow:0 1px 0 var(--blue-700),0 7px 14px oklch(0.2 0.04 60 / .25),inset 0 2px 0 oklch(1 0 0 / .45);transform:translateY(4px)">Pressed</div><div class="tok" style="color:#fff">--press-travel 4px</div></div>
</div>
<div class="cap" style="color:#fff">Recipe: face 500 · top highlight 300 (gradient to 42%) · bottom edge 700 as a hard 0/N/0 shadow · soft drop below · inset 2px white line. Hover: brightness 1.06 only.</div></body></html>
