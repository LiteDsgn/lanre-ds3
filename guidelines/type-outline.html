<!-- @dsCard group="Type" viewport="700x170" name="Outlined display" subtitle="The stroke-behind-fill treatment for text on the world" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--bg-meadow);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div style="display:flex;gap:28px;align-items:baseline;flex-wrap:wrap">
<span class="mp-display mp-outline" style="font-size:44px;text-transform:uppercase">Level 7</span>
<span class="mp-display mp-outline mp-outline-blue" style="font-size:44px">4</span>
<span class="mp-display mp-outline mp-outline-stone" style="font-size:44px">9</span>
<span class="mp-display mp-outline" style="font-size:24px;text-transform:uppercase">Quests</span>
<span class="mp-display mp-outline" style="font-size:14px;text-transform:uppercase;-webkit-text-stroke-width:.2em">Spin</span>
</div>
<div class="cap" style="color:#fff">.mp-outline · stroke --stroke-display (0.16em; 0.20em under 20px) · paint-order: stroke fill · drop 0.12em. Stroke tone matches the surface (ink / blue / stone).</div></body></html>
