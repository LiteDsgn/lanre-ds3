<!-- @dsCard group="Components" viewport="700x540" name="Panels" subtitle="Panel: banner, ribbon and sign headers; cream, wood, sky tones" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../tools/ds-loader.js" data-root="../.." data-components="panels/Panel,buttons/Button,map/StarRating,icons/GameIcon"></script>
<style>html,body{margin:0}body{padding:44px 28px 28px;background:var(--bg-dusk);min-height:100vh;box-sizing:border-box;font-family:var(--font-ui);color:var(--text-primary)}.mp-boot{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;pointer-events:none}
.mp-boot-track{width:180px;height:22px;border-radius:999px;background:oklch(0.30 0.06 55 / .85);border:2px solid oklch(0.20 0.05 55 / .9);box-shadow:inset 0 2px 4px oklch(0 0 0 / .35);overflow:hidden}
.mp-boot-fill{height:100%;width:60%;border-radius:999px;background:linear-gradient(180deg,var(--gold-300),var(--gold-500) 55%,var(--gold-700));position:relative;animation:mp-boot-grow 1.6s var(--ease-out) infinite alternate}
.mp-boot-fill::after{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(-55deg,transparent 0 8px,oklch(1 0 0 / .55) 8px 14px)}
.mp-boot-label{font-family:var(--font-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:#fff;-webkit-text-stroke:.18em var(--ink-900);paint-order:stroke fill;text-shadow:0 2px 0 oklch(0 0 0 / .22)}
@keyframes mp-boot-grow{from{width:25%}to{width:85%}}
</style>
</head><body><div id="root"><div class="mp-boot" aria-hidden="true" style="position:fixed"><div class="mp-boot-track"><div class="mp-boot-fill"></div></div></div></div>
<script type="text/babel">
const Row = ({ children, gap = 14, align = 'center' }) => <div style={{ display: 'flex', gap, alignItems: align, flexWrap: 'wrap' }}>{children}</div>;
const Col = ({ children, gap = 16 }) => <div style={{ display: 'grid', gap }}>{children}</div>;
const Note = ({ children }) => <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 12, color: '#fff', textShadow: '0 1px 0 oklch(0 0 0 / 0.4)', opacity: .9 }}>{children}</span>;

MPReady.then(({ Panel, Button, StarRating, GameIcon }) => {
  const Label = ({ children }) => <div style={{ fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 12, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--ink-500)', textAlign: 'center' }}>{children}</div>;
  const Inset = ({ children }) => <div style={{ margin: '6px 0 14px', padding: '10px 16px', borderRadius: 'var(--radius-pill)', background: 'var(--cream-200)', boxShadow: 'inset 0 2px 4px oklch(0 0 0 / 0.1)', textAlign: 'center', fontFamily: 'var(--font-display)', fontSize: 26, color: 'var(--ink-900)' }}>{children}</div>;
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Row gap={40} align="flex-start">
      <Panel title="Settings" width={200} onClose={() => {}} style={{ marginTop: 10 }}>
        <div style={{ fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 14, color: 'var(--ink-700)', display: 'grid', gap: 8 }}>
          <div>Sound</div><div>Vibration</div><div>Language</div>
        </div>
      </Panel>
      <Panel title="Complete" eyebrow="Level 23" header="ribbon" width={220} footer={<Button variant="confirm" size="md">OK</Button>}>
        <div style={{ display: 'grid', placeItems: 'center', marginTop: -6 }}><StarRating value={3} size={26} arc /></div>
        <Label>Score</Label><Inset>14 000</Inset>
      </Panel>
      <Panel title="Daily Reward" header="sign" tone="wood" width={200} footer={<Button size="md">Claim</Button>}>
        <div style={{ display: 'grid', placeItems: 'center', gap: 6, fontFamily: 'var(--font-ui)', fontWeight: 700, color: 'var(--wood-900)' }}><GameIcon kind="gift" size={48} />Day 3</div>
      </Panel>
    </Row>
  );
});
</script></body></html>
