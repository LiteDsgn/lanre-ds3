<!-- @dsCard group="Effects" viewport="700x190" name="Shadows & glows" subtitle="Warm-tinted drops; glow rings mark the tappable / rewarded thing" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--bg-meadow);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row" style="align-items:center">
<div class="sw" style="align-items:center"><div style="width:100%;height:70px;border-radius:16px;background:var(--cream-100);border:4px solid var(--cream-300);box-shadow:var(--shadow-drop-sm)"></div><div class="tok" style="color:#fff">--shadow-drop-sm</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:70px;border-radius:16px;background:var(--cream-100);border:4px solid var(--cream-300);box-shadow:var(--shadow-drop)"></div><div class="tok" style="color:#fff">--shadow-drop</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:70px;border-radius:16px;background:var(--cream-100);border:4px solid var(--cream-300);box-shadow:var(--shadow-panel)"></div><div class="tok" style="color:#fff">--shadow-panel</div></div>
<div style="width:16px"></div>
<div class="sw" style="align-items:center"><div style="width:64px;height:64px;border-radius:16px;background:var(--gold-500);box-shadow:var(--glow-gold);margin:3px 0"></div><div class="tok" style="color:#fff">--glow-gold</div></div><div class="sw" style="align-items:center"><div style="width:64px;height:64px;border-radius:16px;background:var(--blue-500);box-shadow:var(--glow-blue);margin:3px 0"></div><div class="tok" style="color:#fff">--glow-blue</div></div><div class="sw" style="align-items:center"><div style="width:64px;height:64px;border-radius:16px;background:var(--berry-500);box-shadow:var(--glow-berry);margin:3px 0"></div><div class="tok" style="color:#fff">--glow-berry</div></div>
</div>
<div class="cap" style="color:#fff">Drops are tinted oklch(0.22–0.25 0.05 60): brown, never grey. Glows use the tone at 50% (ring) + 70% (bloom).</div></body></html>
