<!-- @dsCard group="Colors" viewport="700x150" name="Sky blue" subtitle="Action ramp: play, current level, water" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--blue-100);"></div><div class="tok">--blue-100</div><div class="val">oklch(0.94 0.05 228)</div></div><div class="sw"><div class="chip" style="background:var(--blue-300);"></div><div class="tok">--blue-300</div><div class="val">oklch(0.83 0.11 232)</div></div><div class="sw"><div class="chip" style="background:var(--blue-500);"></div><div class="tok">--blue-500</div><div class="val">oklch(0.68 0.17 240)</div></div><div class="sw"><div class="chip" style="background:var(--blue-700);"></div><div class="tok">--blue-700</div><div class="val">oklch(0.52 0.17 250)</div></div><div class="sw"><div class="chip" style="background:var(--blue-900);"></div><div class="tok">--blue-900</div><div class="val">oklch(0.36 0.12 255)</div></div></div>
<div class="cap">500 face / 700 bevel / 300 highlight, the same three-step recipe every tone uses.</div></body></html>
