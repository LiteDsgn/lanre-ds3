<!-- @dsCard group="Brand" viewport="700x170" name="Iconography" subtitle="Phosphor: FILL for pictorial glyphs, BOLD for utility strokes; both get the outline when on the world" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap;font-size:34px">
<div style="display:flex;gap:12px;color:var(--gold-500);-webkit-text-stroke:3.5px var(--gold-900);paint-order:stroke fill;filter:drop-shadow(0 2px 0 oklch(0 0 0 / .25))"><i class="ph-fill ph-coin"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-gift" style="color:var(--berry-500);-webkit-text-stroke-color:var(--berry-900)"></i><i class="ph-fill ph-heart" style="color:var(--coral-500);-webkit-text-stroke-color:var(--coral-900)"></i><i class="ph-fill ph-treasure-chest" style="color:var(--wood-500);-webkit-text-stroke-color:var(--wood-900)"></i></div>
<div class="tok" style="width:120px;white-space:normal">ph-fill · pictorial, always toned + outlined</div>
<div style="display:flex;gap:12px;color:var(--ink-900)"><i class="ph-bold ph-x"></i><i class="ph-bold ph-plus"></i><i class="ph-bold ph-check"></i><i class="ph-bold ph-caret-left"></i><i class="ph-bold ph-gear"></i></div>
<div class="tok" style="width:130px;white-space:normal">ph-bold · utility strokes, plain white inside buttons</div>
</div></body></html>
