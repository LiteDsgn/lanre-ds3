<!-- @dsCard group="Colors" viewport="700x170" name="Environments" subtitle="World backgrounds and scrim: CSS gradients, no imagery required" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row" style="height:110px"><div class="sw"><div class="chip" style="background:var(--bg-meadow);height:100%"></div><div class="tok">--bg-meadow</div><div class="val">grass</div></div><div class="sw"><div class="chip" style="background:var(--bg-sky);height:100%"></div><div class="tok">--bg-sky</div><div class="val">sky / loading</div></div><div class="sw"><div class="chip" style="background:var(--bg-dusk);height:100%"></div><div class="tok">--bg-dusk</div><div class="val">evening / premium</div></div><div class="sw"><div class="chip" style="height:100%;background:var(--bg-meadow);position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:var(--bg-scrim)"></div></div><div class="tok">--bg-scrim</div><div class="val">over the world, behind panels</div></div></div></body></html>
