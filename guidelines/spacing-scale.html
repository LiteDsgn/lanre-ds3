<!-- @dsCard group="Spacing" viewport="700x200" name="Space scale" subtitle="4px base: the only spacing values" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div style="display:grid;gap:6px"><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-1</div><div style="height:12px;width:var(--space-1);background:var(--blue-500);border-radius:3px"></div><div class="val">4px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-2</div><div style="height:12px;width:var(--space-2);background:var(--blue-500);border-radius:3px"></div><div class="val">8px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-3</div><div style="height:12px;width:var(--space-3);background:var(--blue-500);border-radius:3px"></div><div class="val">12px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-4</div><div style="height:12px;width:var(--space-4);background:var(--blue-500);border-radius:3px"></div><div class="val">16px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-5</div><div style="height:12px;width:var(--space-5);background:var(--blue-500);border-radius:3px"></div><div class="val">20px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-6</div><div style="height:12px;width:var(--space-6);background:var(--blue-500);border-radius:3px"></div><div class="val">24px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-8</div><div style="height:12px;width:var(--space-8);background:var(--blue-500);border-radius:3px"></div><div class="val">32px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-10</div><div style="height:12px;width:var(--space-10);background:var(--blue-500);border-radius:3px"></div><div class="val">40px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-12</div><div style="height:12px;width:var(--space-12);background:var(--blue-500);border-radius:3px"></div><div class="val">48px</div></div><div style="display:flex;align-items:center;gap:12px"><div class="tok" style="width:80px">--space-16</div><div style="height:12px;width:var(--space-16);background:var(--blue-500);border-radius:3px"></div><div class="val">64px</div></div></div></body></html>
