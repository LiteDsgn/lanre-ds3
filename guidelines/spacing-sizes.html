<!-- @dsCard group="Spacing" viewport="700x200" name="Sizes" subtitle="Touch targets, glyphs, pucks and cells" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap">
<div style="display:grid;gap:4px;justify-items:center"><div style="width:20px;height:20px;background:var(--gold-500);border-radius:8px"></div><div class="tok">--size-icon-sm</div><div class="val">20</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:28px;height:28px;background:var(--gold-500);border-radius:8px"></div><div class="tok">--size-icon</div><div class="val">28</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:40px;height:40px;background:var(--gold-500);border-radius:8px"></div><div class="tok">--size-icon-lg</div><div class="val">40</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:64px;height:64px;background:var(--gold-500);border-radius:8px"></div><div class="tok">--size-icon-xl</div><div class="val">64</div></div>
<div style="width:14px"></div>
<div style="display:grid;gap:4px;justify-items:center"><div style="width:108px;height:36px;background:var(--blue-500);border-radius:18px"></div><div class="tok">--size-pill-h</div><div class="val">36</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:48px;height:48px;background:var(--blue-500);border-radius:24px"></div><div class="tok">--size-touch</div><div class="val">48</div></div><div style="display:grid;gap:4px;justify-items:center"><div style="width:140px;height:60px;background:var(--blue-500);border-radius:30px"></div><div class="tok">--size-touch-lg</div><div class="val">60</div></div>
<div style="width:14px"></div>
<div style="display:grid;gap:4px;justify-items:center"><div style="width:84px;height:52px;background:var(--stone-300);border-radius:50%"></div><div class="tok">--size-puck</div><div class="val">84</div></div>
<div style="display:grid;gap:4px;justify-items:center"><div style="width:72px;height:72px;background:var(--surface-cell);border-radius:16px"></div><div class="tok">--size-cell</div><div class="val">72</div></div>
</div></body></html>
