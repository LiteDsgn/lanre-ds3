<!-- @dsCard group="Components" viewport="700x300" name="Forms" subtitle="Switch + Slider inside a settings panel" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../tools/ds-loader.js" data-root="../.." data-components="forms/Switch,forms/Slider,icons/GameIcon"></script>
<style>html,body{margin:0}body{padding:18px;background:var(--bg-sky);min-height:100vh;box-sizing:border-box;font-family:var(--font-ui);color:var(--text-primary)}.mp-boot{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;pointer-events:none}
.mp-boot-track{width:180px;height:22px;border-radius:999px;background:oklch(0.30 0.06 55 / .85);border:2px solid oklch(0.20 0.05 55 / .9);box-shadow:inset 0 2px 4px oklch(0 0 0 / .35);overflow:hidden}
.mp-boot-fill{height:100%;width:60%;border-radius:999px;background:linear-gradient(180deg,var(--gold-300),var(--gold-500) 55%,var(--gold-700));position:relative;animation:mp-boot-grow 1.6s var(--ease-out) infinite alternate}
.mp-boot-fill::after{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(-55deg,transparent 0 8px,oklch(1 0 0 / .55) 8px 14px)}
.mp-boot-label{font-family:var(--font-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:#fff;-webkit-text-stroke:.18em var(--ink-900);paint-order:stroke fill;text-shadow:0 2px 0 oklch(0 0 0 / .22)}
@keyframes mp-boot-grow{from{width:25%}to{width:85%}}
</style>
</head><body><div id="root"><div class="mp-boot" aria-hidden="true" style="position:fixed"><div class="mp-boot-track"><div class="mp-boot-fill"></div></div></div></div>
<script type="text/babel">
const Row = ({ children, gap = 14, align = 'center' }) => <div style={{ display: 'flex', gap, alignItems: align, flexWrap: 'wrap' }}>{children}</div>;
const Col = ({ children, gap = 16 }) => <div style={{ display: 'grid', gap }}>{children}</div>;
const Note = ({ children }) => <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 12, color: '#fff', textShadow: '0 1px 0 oklch(0 0 0 / 0.4)', opacity: .9 }}>{children}</span>;

MPReady.then(({ Switch, Slider, GameIcon }) => {
  function Demo() {
    const [sound, setSound] = React.useState(true);
    const [vib, setVib] = React.useState(false);
    const [music, setMusic] = React.useState(70);
    const [sfx, setSfx] = React.useState(45);
    const RowL = ({ icon, label, children }) => (
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, height: 44 }}>
        <GameIcon kind={icon} size={26} /><span style={{ flex: 1, fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 16, color: 'var(--ink-900)' }}>{label}</span>{children}
      </div>
    );
    return (
      <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' }}>
        <div style={{ width: 260, padding: '12px 16px', background: 'var(--cream-100)', border: '4px solid var(--cream-300)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-drop)' }}>
          <RowL icon="sound" label="Sound"><Switch checked={sound} onChange={setSound} label="Sound" /></RowL>
          <RowL icon="vibrate" label="Vibration"><Switch checked={vib} onChange={setVib} label="Vibration" tone="blue" /></RowL>
          <RowL icon="bell" label="Notifications"><Switch checked size="sm" tone="gold" /></RowL>
          <RowL icon="lock" label="Disabled"><Switch checked={false} disabled /></RowL>
        </div>
        <div style={{ width: 320, padding: '16px', background: 'var(--cream-100)', border: '4px solid var(--cream-300)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-drop)', display: 'grid', gap: 12 }}>
          <Slider value={music} onChange={setMusic} icon={<GameIcon kind="music" size={28} />} label="Music" width="100%" />
          <Slider value={sfx} onChange={setSfx} tone="teal" icon={<GameIcon kind="sound" tone="teal" size={28} />} label="Effects" width="100%" />
          <Slider value={30} tone="gold" icon={<GameIcon kind="sparkle" size={28} />} width="100%" disabled />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
