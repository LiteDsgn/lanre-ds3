<!-- @dsCard group="Colors" viewport="700x230" name="Semantic aliases" subtitle="Action, state and currency tokens that components actually read" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

.tok{white-space:normal;word-break:break-all;line-height:1.2}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--action-primary);"></div><div class="tok">--action-primary</div></div><div class="sw"><div class="chip" style="background:var(--action-play);"></div><div class="tok">--action-play</div></div><div class="sw"><div class="chip" style="background:var(--action-confirm);"></div><div class="tok">--action-confirm</div></div><div class="sw"><div class="chip" style="background:var(--action-danger);"></div><div class="tok">--action-danger</div></div><div class="sw"><div class="chip" style="background:var(--action-premium);"></div><div class="tok">--action-premium</div></div><div class="sw"><div class="chip" style="background:var(--state-locked);"></div><div class="tok">--state-locked</div></div><div class="sw"><div class="chip" style="background:var(--state-current);"></div><div class="tok">--state-current</div></div><div class="sw"><div class="chip" style="background:var(--state-complete);"></div><div class="tok">--state-complete</div></div></div>
<div class="row" style="margin-top:10px"><div class="sw"><div class="chip" style="background:var(--currency-coin);"></div><div class="tok">--currency-coin</div></div><div class="sw"><div class="chip" style="background:var(--currency-gem);"></div><div class="tok">--currency-gem</div></div><div class="sw"><div class="chip" style="background:var(--currency-gem-alt);"></div><div class="tok">--currency-gem-alt</div></div><div class="sw"><div class="chip" style="background:var(--currency-heart);"></div><div class="tok">--currency-heart</div></div><div class="sw"><div class="chip" style="background:var(--currency-energy);"></div><div class="tok">--currency-energy</div></div><div class="sw"><div class="chip" style="background:var(--star-fill);"></div><div class="tok">--star-fill</div></div><div class="sw"><div class="chip" style="background:var(--star-empty);"></div><div class="tok">--star-empty</div></div><div class="sw"><div class="chip" style="background:var(--surface-panel);"></div><div class="tok">--surface-panel</div></div><div class="sw"><div class="chip" style="background:var(--surface-inset);"></div><div class="tok">--surface-inset</div></div></div></body></html>
