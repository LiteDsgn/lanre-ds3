<!-- @dsCard group="Components" viewport="700x420" name="Rewards & shop" subtitle="RewardCard, ItemCell, ShopRow" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../tools/ds-loader.js" data-root="../.." data-components="rewards/RewardCard,rewards/ItemCell,rewards/ShopRow,feedback/Tag,icons/GameIcon"></script>
<style>html,body{margin:0}body{padding:18px;background:var(--bg-meadow);min-height:100vh;box-sizing:border-box;font-family:var(--font-ui);color:var(--text-primary)}.mp-boot{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;pointer-events:none}
.mp-boot-track{width:180px;height:22px;border-radius:999px;background:oklch(0.30 0.06 55 / .85);border:2px solid oklch(0.20 0.05 55 / .9);box-shadow:inset 0 2px 4px oklch(0 0 0 / .35);overflow:hidden}
.mp-boot-fill{height:100%;width:60%;border-radius:999px;background:linear-gradient(180deg,var(--gold-300),var(--gold-500) 55%,var(--gold-700));position:relative;animation:mp-boot-grow 1.6s var(--ease-out) infinite alternate}
.mp-boot-fill::after{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(-55deg,transparent 0 8px,oklch(1 0 0 / .55) 8px 14px)}
.mp-boot-label{font-family:var(--font-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:#fff;-webkit-text-stroke:.18em var(--ink-900);paint-order:stroke fill;text-shadow:0 2px 0 oklch(0 0 0 / .22)}
@keyframes mp-boot-grow{from{width:25%}to{width:85%}}
</style>
</head><body><div id="root"><div class="mp-boot" aria-hidden="true" style="position:fixed"><div class="mp-boot-track"><div class="mp-boot-fill"></div></div></div></div>
<script type="text/babel">
const Row = ({ children, gap = 14, align = 'center' }) => <div style={{ display: 'flex', gap, alignItems: align, flexWrap: 'wrap' }}>{children}</div>;
const Col = ({ children, gap = 16 }) => <div style={{ display: 'grid', gap }}>{children}</div>;
const Note = ({ children }) => <span style={{ fontFamily: 'var(--font-ui)', fontWeight: 700, fontSize: 12, color: '#fff', textShadow: '0 1px 0 oklch(0 0 0 / 0.4)', opacity: .9 }}>{children}</span>;

MPReady.then(({ RewardCard, ItemCell, ShopRow, Tag, GameIcon }) => {
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Col gap={20}>
      <Row gap={10} align="stretch">
        <RewardCard title="Day 1" icon={<GameIcon kind="coin" size={40} />} amount="+1M" state="claimed" />
        <RewardCard title="Day 2" icon={<GameIcon kind="coin" size={40} />} amount="+5M" state="claimed" />
        <RewardCard title="Day 3" icon={<GameIcon kind="gift" size={40} />} state="available" onClick={() => {}} />
        <RewardCard title="Day 4" icon={<GameIcon kind="ticket" size={40} />} amount="+100" state="locked" />
        <RewardCard title="Day 5" icon={<GameIcon kind="gem" size={40} />} amount="+10" state="locked" />
        <RewardCard title="Day 7" featured width={230} icon={<GameIcon kind="heart" size={40} />} amount="+50" state="locked" />
      </Row>
      <Row gap={8}>
        <ItemCell state="filled" content={<GameIcon kind="egg" size={44} />} count={1} selected onClick={() => {}} />
        <ItemCell state="filled" content={<GameIcon kind="leaf" size={44} />} count={4} />
        <ItemCell state="filled" content={<GameIcon kind="fire" size={44} />} count={6} dim />
        <ItemCell state="filled" content={<GameIcon kind="gem" size={44} />} count={2} />
        <ItemCell state="empty" /><ItemCell state="locked" /><ItemCell state="add" onClick={() => {}} label="Buy slot" />
        <ItemCell state="filled" size={56} content={<GameIcon kind="key" size={32} />} count={9} />
      </Row>
      <Col gap={14}>
        <ShopRow tone="featured" icon={<GameIcon kind="coins" size={48} />} title="3,000 coins" subtitle="One-time offer" price="USD 3.99" tag={<Tag tone="gold">3x the value</Tag>} />
        <Row gap={14} align="stretch">
          <ShopRow style={{ flex: 1, minWidth: 300 }} icon={<GameIcon kind="coin" size={44} />} title="2,720 coins" price="USD 0.99" tag={<Tag>Most popular</Tag>} />
          <ShopRow style={{ flex: 1, minWidth: 300 }} icon={<GameIcon name="prohibit" tone="berry" size={44} />} title="No ads" subtitle="Rewarded videos still available" price="USD 0.99" />
        </Row>
      </Col>
    </Col>
  );
});
</script></body></html>
