<!-- @dsCard group="Colors" viewport="700x150" name="Parchment · Ink" subtitle="Panel surfaces and warm text colors" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cream-50);"></div><div class="tok">--cream-50</div></div><div class="sw"><div class="chip" style="background:var(--cream-100);"></div><div class="tok">--cream-100</div></div><div class="sw"><div class="chip" style="background:var(--cream-200);"></div><div class="tok">--cream-200</div></div><div class="sw"><div class="chip" style="background:var(--cream-300);"></div><div class="tok">--cream-300</div></div><div style="width:10px"></div><div class="sw"><div class="chip" style="background:var(--ink-900);"></div><div class="tok">--ink-900</div></div><div class="sw"><div class="chip" style="background:var(--ink-700);"></div><div class="tok">--ink-700</div></div><div class="sw"><div class="chip" style="background:var(--ink-500);"></div><div class="tok">--ink-500</div></div><div class="sw"><div class="chip" style="background:var(--white);"></div><div class="tok">--white</div><div class="val">#ffffff</div></div></div>
<div class="cap">Text is warm brown, never pure black. Cream-300 is the panel border; cream-200 the inset well.</div></body></html>
