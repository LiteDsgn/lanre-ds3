<!-- @dsCard group="Brand" viewport="700x190" name="Imagery slots" subtitle="Painted world art is dropped in by artists, the system reserves the slot" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--bg-meadow);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div style="display:flex;gap:16px;align-items:stretch">
<div style="flex:1;height:130px;border-radius:22px;border:3px dashed oklch(1 0 0 / .7);background:repeating-linear-gradient(-45deg,oklch(1 0 0 / .18) 0 10px,transparent 10px 20px);display:grid;place-items:center;font:600 11px ui-monospace,monospace;color:#fff;text-align:center;text-shadow:0 1px 0 oklch(0 0 0 / .4)">world illustration<br>(hero cottage, trees, path)</div>
<div style="width:150px;height:130px;border-radius:22px;border:3px dashed oklch(1 0 0 / .7);background:repeating-linear-gradient(-45deg,oklch(1 0 0 / .18) 0 10px,transparent 10px 20px);display:grid;place-items:center;font:600 11px ui-monospace,monospace;color:#fff;text-align:center;text-shadow:0 1px 0 oklch(0 0 0 / .4)">prize render<br>(gift box, chest)</div>
<div style="width:110px;height:130px;border-radius:22px;border:3px dashed oklch(1 0 0 / .7);background:repeating-linear-gradient(-45deg,oklch(1 0 0 / .18) 0 10px,transparent 10px 20px);display:grid;place-items:center;font:600 11px ui-monospace,monospace;color:#fff;text-align:center;text-shadow:0 1px 0 oklch(0 0 0 / .4)">character<br>(mascot)</div>
</div>
<div class="cap" style="color:#fff">Until art lands, use the striped slot with a monospace note. Never hand-draw substitutes; GameIcon glyphs stand in for prizes only.</div></body></html>
