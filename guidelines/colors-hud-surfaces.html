<!-- @dsCard group="Colors" viewport="700x170" name="HUD surfaces" subtitle="Translucent surfaces that sit over the world" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--bg-meadow);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row" style="height:100px">
<div class="sw"><div class="chip" style="height:100%;background:var(--surface-hud);border:2px solid oklch(0.20 0.05 55 / 0.9)"></div><div class="tok" style="color:#fff">--surface-hud</div><div class="val" style="color:#fff">currency pills, toasts, tracks</div></div>
<div class="sw"><div class="chip" style="height:100%;background:var(--surface-cell);border:3px solid oklch(1 0 0 / 0.08)"></div><div class="tok" style="color:#fff">--surface-cell</div><div class="val" style="color:#fff">inventory grid</div></div>
<div class="sw"><div class="chip" style="height:100%;background:var(--surface-cell-active);border:3px solid var(--teal-300)"></div><div class="tok" style="color:#fff">--surface-cell-active</div><div class="val" style="color:#fff">selected cell</div></div>
<div class="sw"><div class="chip" style="height:100%;background:var(--surface-panel);border:4px solid var(--surface-panel-border)"></div><div class="tok" style="color:#fff">--surface-panel</div><div class="val" style="color:#fff">+ --surface-panel-border</div></div>
<div class="sw"><div class="chip" style="height:100%;background:var(--surface-wood-plank);border:6px solid var(--surface-wood)"></div><div class="tok" style="color:#fff">--surface-wood-plank</div><div class="val" style="color:#fff">+ --surface-wood</div></div>
</div></body></html>
