<!-- @dsCard group="Colors" viewport="700x150" name="Gold" subtitle="Reward ramp: coins, stars, primary CTA" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}body{padding:14px;background:var(--cream-50);font-family:var(--font-ui);color:var(--ink-900);box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:8px;align-items:stretch}
.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.08)}
.tok{font:600 10.5px/1.25 ui-monospace,Menlo,monospace;color:var(--ink-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:500 9.5px/1.2 ui-monospace,Menlo,monospace;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{font:700 11px/1.3 var(--font-ui);color:var(--ink-500);margin-top:10px}

</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--gold-100);"></div><div class="tok">--gold-100</div><div class="val">oklch(0.97 0.06 92)</div></div><div class="sw"><div class="chip" style="background:var(--gold-300);"></div><div class="tok">--gold-300</div><div class="val">oklch(0.92 0.14 90)</div></div><div class="sw"><div class="chip" style="background:var(--gold-500);"></div><div class="tok">--gold-500</div><div class="val">oklch(0.86 0.17 85)</div></div><div class="sw"><div class="chip" style="background:var(--gold-700);"></div><div class="tok">--gold-700</div><div class="val">oklch(0.71 0.16 68)</div></div><div class="sw"><div class="chip" style="background:var(--gold-900);"></div><div class="tok">--gold-900</div><div class="val">oklch(0.44 0.10 58)</div></div></div>
<div class="cap">Gold buttons take dark text (--gold-900), never white. 700 is orange, used for ribbons and star outlines.</div></body></html>
